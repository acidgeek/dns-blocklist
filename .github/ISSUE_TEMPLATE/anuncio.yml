name: Se cuela un anuncio
description: Una app vuelve a mostrar anuncios
title: "[Anuncio] "
labels: ["anuncio"]
body:
  - type: input
    id: app
    attributes:
      label: App
    validations:
      required: true
  - type: textarea
    id: donde
    attributes:
      label: ¿Dónde aparece el anuncio?
      placeholder: "Ej.: video al abrir, banner abajo, entre publicaciones"
    validations:
      required: true
